<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <title>Sign Up & Login</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            background-color: #DBEAFE;
        }

        .log-sec {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #fdfdfd;
            max-width: 1000px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 2px 6px 10px rgba(0, 0, 0, 0.15);
        }

        .log-btn {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            padding: 5px 10px;
            border-radius: 5px;
            background-color: #F3F4F6;
        }

        .left {
            padding: 10px 50px;
            text-decoration: none;
            color: #4B5563;
            border-radius: 5px;
        }

        .right {
            padding: 10px 50px;
            text-decoration: none;
            color: #ffffff;
            border-radius: 5px;
            background-color: #2563EB;
        }

        .log-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px 0;
            gap: 20px;

        }

        .options {
            flex: 0 0 300px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 10px;
            gap: 10px;
            aspect-ratio: 9/6;
            transition: all .3s ease;
        }

        .options span {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .options h3 {
            font-size: 18px;
        }

        .options p {
            font-size: 14px;
            color: #4B5563;
            text-align: center;
        }

        .box1,
        .box3 {
            background: linear-gradient(135deg, #EFF6FF -2%, #F5F3FF 100%);
            border: 1px solid #DBEAFE;
        }

        .box1 span,
        .box3 span {
            background-color: #DBEAFE;
            color: #2563EB;
        }

        .box2 {
            background: linear-gradient(135deg, #F5F3FF -2%, #EFF6FF 100%);
            border: 1px solid #EDE9FE;
        }

        .box2 span {
            background-color: #EDE9FE;
            color: #7C3AED;
        }

        .options:hover {
            box-shadow: 1px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .log-sec p{
            color: #4B5563;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <main>
        <div class="log-sec">
            <div class="log-btn">
                <a href="./sign.html" class="left">Sign Up</a>
                <a href="./log.html" class="right">Login</a>
            </div>
            <div class="log-option">
                <a class="options box1" href="./patient/patient-login.html">
                    <span><i class="fas fa-user-injured"></i></span>
                    <h3>Patient</h3>
                    <p>Book appointments, access medical records & get health tips</p>
                </a>
                <a class="options box2" href="./doctor/doctor-login.html">
                    <span><i class="fas fa-user-md"></i></span>
                    <h3>Doctor</h3>
                    <p>Manage appointments, consult with patients & provide healthcare services</p>
                </a>
                <a class="options box3" href="./admin/admin-login.html">
                    <span><i class="fa-solid fa-shield-halved"></i></span>
                    <h3>Admin</h3>
                    <p>Oversee platform operations, manage users, and maintain system security.</p>
                </a>
            </div>
            <p>Choose your role to continue</p>
        </div>
    </main>

</body>

</html>
