<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Signup</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
            background-color: aliceblue;

        }

        /* Full Page Layout */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row-reverse;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0px 0px 10px #1800b1;

        }

        /* Left Side Image */
        .left {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .left img {
            width: 80%;
            border-radius: 10px;
            box-shadow: 0, 5px, 10px rgba(0, 0, 0, 0.2);


        }

        /* Right Side Form */
        .right {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-right: 2px solid rgba(216, 216, 216, 0.601);
        }

        h2 {
            text-align: left;
            width: 100%;
            max-width: 500px;
            font-size: 25px;
            margin-bottom: 18px;
        }


        /* Form Styling */
        form {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
        }

        /* Input Fields */
        input,select {
            padding: 10px 0;
            margin: 8px 0;
            border: none;
            border-bottom: 1px solid rgb(190, 185, 185);
            font-size: 14px;
            color: gray;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-bottom: 1px solid #10217d;
        }


        /* Signup Button */
        .signup-btn {
            padding: 12px;
            background: #10217d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0px 3px 12px rgba(0, 0, 0, 0.2);
        }

        .signup-btn:hover {
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Already have an account */
        .login-link {
            margin-top: 15px;
            font-size: 12px;
            color: gray;
        }

        .login-link a {
            color: #10217d;
            text-decoration: none;
            font-weight: bolder;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .note {
            max-width: 500px;
            width: 100%;
            color: #527c88;
            margin-top: 30px;
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: 1px;
            word-spacing: 2px;
            text-align: justify;

        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
            }

            .left {
                width: 100%;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Side Image -->
        <div class="left">
            <img src="../img/signup-d.jpg" alt="Signup Image">
        </div>

        <!-- Right Side Form -->
        <div class="right">
            <h2>Create Account</h2>

            <!-- Signup Form -->
            <form action="doctor-signup-submit.php" method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="text" name="UID" placeholder="License No" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="tel" name="phone" placeholder="Ph no" required>

                <select name="gender" id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit" class="signup-btn">Create Account</button>

                <p class="login-link">Already have an account? <a href="doctor-login.html">Login</a></p>
            </form>

            <p class="note">You want to join our team? Fill out the form and send us your details. After verification,
                you will receive your ID and password via email within 24 hours.</p>
        </div>
    </div>

</body>

</html>
