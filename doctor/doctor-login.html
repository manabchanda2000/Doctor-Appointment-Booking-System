<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
            background-color: aliceblue;
            animation: fadeSlide 0.5s ease-out;
        }

        /* Page animation */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translatex(100%);
            }

            to {
                opacity: 1;
                transform: translatex(0%);
            }
        }

        /* Full Page Layout */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row-reverse;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0px 0px 10px #1800b1;

        }

        /* Left Side Image */
        .left {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .left img {
            width: 80%;
            border-radius: 10px;
            box-shadow: 0, 5px, 10px rgba(0, 0, 0, 0.2);

        }

        /* Right Side Form */
        .right {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-right: 2px solid rgba(216, 216, 216, 0.601);
        }

        h2 {
            text-align: left;
            width: 100%;
            max-width: 500px;
            font-size: 25px;
            margin-bottom: 25px;
        }

        /* User Type Buttons */
        .user-type {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .user-btn {
            width: 32%;
            padding: 10px 12px;
            margin: 0 10px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .user-btn:hover {
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Form Styling */
        form {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
        }

        /* Input Fields */
        input {
            padding: 10px 0;
            margin: 8px 0;
            border: none;
            border-bottom: 1px solid rgb(190, 185, 185);
            font-size: 14px;
            color: gray;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-bottom: 1px solid #10217d;
        }


        /* Signup Button */
        .signup-btn {
            padding: 12px;
            background: #10217d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 25px;
            margin-bottom: 10px;
            transition: 0.3s;
            box-shadow: 0px 3px 12px rgba(0, 0, 0, 0.2);
        }

        .signup-btn:hover {
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Already have an account */
        .login-link {
            font-size: 12px;
            color: gray;
        }

        .login-link a {
            color: #10217d;
            text-decoration: none;
            font-weight: bolder;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
            }

            .left {
                width: 100%;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Side Image -->
        <div class="left">
            <img src="../img/signup-d.jpg" alt="Signup Image">
        </div>

        <!-- Right Side Form -->
        <div class="right">
            <h2 style="text-align: center;">Login as a <span style="font-size: 26px; font-weight: bolder; color: #0040ff;">Doctor</span></h2>

            <!-- User Type Selection -->
            <div class="user-type">
                <a href="doctor-login.html" class="user-btn" style="background-color: #10217d;">Doctor</a>
                <a href="../patient/patient-login.html" class="user-btn" style="background-color: #89dee2;">Patient</a>
            </div>

            <!-- Signup Form -->
            <form action="doctor-login-submit.php" method="POST">
                <input type="email" placeholder="Email" name="email" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <p class="login-link"><a href="#">Forget Password</a></p>

                <input type="hidden" id="device_info" name="device_info">

                <button type="submit" class="signup-btn">Login</button>
                <p class="login-link">Have no account? <a href="doctor-signup.html">Register</a></p>
            </form>

        </div>
    </div>
<script>
    // ✅ Get Correct Device Info
    function getDeviceInfo() {
            let userAgent = navigator.userAgent;
            let platform = navigator.platform;
            let browser = "Unknown Browser";

            if (userAgent.includes("Edg")) browser = "Microsoft Edge"; // ✅ Edge Fix
            else if (userAgent.includes("Firefox")) browser = "Mozilla Firefox";
            else if (userAgent.includes("Chrome") && !userAgent.includes("Edg")) browser = "Google Chrome";
            else if (userAgent.includes("Safari") && !userAgent.includes("Chrome")) browser = "Safari";
            else if (userAgent.includes("Opera") || userAgent.includes("OPR")) browser = "Opera";
            else if (userAgent.includes("MSIE") || userAgent.includes("Trident")) browser = "Internet Explorer";

            return `${platform} - ${browser}`;
        }

        document.getElementById("device_info").value = getDeviceInfo();
</script>
</body>

</html>
